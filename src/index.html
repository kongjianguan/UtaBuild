<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>UtaBuild - 歌詞ビューア</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="has-bottom-menu">
  <div id="app">
    <!-- 搜索界面 -->
    <header id="search-header">
      <h1>UtaBuild</h1>
      <p class="subtitle">Ruby 歌詞ビューア</p>
      <p class="subtitle-note">搜索日文歌词，并以假名注音辅助阅读。</p>
      <div class="ruby-sample" aria-hidden="true">
        <ruby>春<rt>はる</rt></ruby><ruby>日<rt>ひ</rt></ruby><ruby>影<rt>かげ</rt></ruby>
      </div>
      
      <div class="search-form">
        <input
          type="text"
          id="search-title"
          placeholder="曲名を入力..."
          autocomplete="off"
          style="ime-mode: disabled;"
        />
        <input 
          type="text" 
          id="search-artist" 
          placeholder="アーティスト名（任意）"
          autocomplete="off"
        />
        <button id="search-btn" type="button">検索</button>
      </div>

      <section class="search-history">
        <h2 class="search-history__title">検索履歴</h2>
        <div id="search-history-list" class="search-history__list"></div>
        <p id="search-history-empty" class="search-history__empty">まだ検索履歴はありません。搜索后会显示在这里。</p>
      </section>
    </header>

    <!-- 歌曲页面 -->
    <section id="songs-view" class="songs-view hidden">
      <div class="songs-header">
        <div>
          <h2>保存済みの曲</h2>
          <p>已永久保存的歌词会显示在这里。</p>
        </div>
        <div class="songs-sort" aria-label="保存済み曲の並び替え">
          <button type="button" class="secondary active" data-song-sort="title" aria-pressed="true">曲名</button>
          <button type="button" class="secondary" data-song-sort="artist" aria-pressed="false">アーティスト</button>
        </div>
      </div>
      <div id="songs-list" class="songs-list"></div>
      <p id="songs-empty" class="songs-empty">保存済みの歌詞はまだありません。搜索并打开歌词后会永久保存到这里。</p>
    </section>

    <!-- 设置页面 -->
    <section id="settings-view" class="settings-view hidden">
      <h2>設定</h2>
      <div class="settings-list">
        <label class="settings-item" for="setting-use-cache">
          <div class="settings-item__text">
            <span class="settings-item__label">キャッシュを使う</span>
            <span class="settings-item__description">一天内命中缓存时直接使用缓存数据。</span>
          </div>
          <input type="checkbox" id="setting-use-cache" />
        </label>
        <label class="settings-item settings-item--select" for="setting-artwork-source">
          <div class="settings-item__text">
            <span class="settings-item__label">ジャケット画像ソース</span>
            <span class="settings-item__description">默认先用 UtaTen；无图时自动尝试 QQ 音乐和网易云。</span>
          </div>
          <select id="setting-artwork-source" class="settings-select">
            <option value="auto">自動</option>
            <option value="utaten">UtaTen</option>
            <option value="qq">QQ 音楽</option>
            <option value="netease">网易云音乐</option>
          </select>
        </label>
        <button id="setting-clear-cache" type="button" class="settings-item settings-item--button">
          <div class="settings-item__text">
            <span class="settings-item__label">キャッシュを削除</span>
            <span class="settings-item__description">清除搜索结果、歌词缓存文件和内存缓存。</span>
          </div>
        </button>
        <button id="setting-goto-lsp" type="button" class="settings-item settings-item--button">
          <div class="settings-item__text">
            <span class="settings-item__label">LSP相关</span>
            <span class="settings-item__description">配置LSP日志、Hi UtaBuild通知和自动跳转行为。</span>
          </div>
        </button>
      </div>
    </section>

    <!-- LSP设置页面 -->
    <section id="lsp-settings-view" class="lsp-settings-view hidden">
      <div class="subpage-header">
        <button id="lsp-settings-back-btn" type="button" class="secondary">設定に戻る</button>
        <div>
          <h2>LSP設定</h2>
          <p>配置 LSPosed 模块的行为。</p>
        </div>
      </div>
      <div class="settings-list">
        <label class="settings-item" for="setting-lsp-log">
          <div class="settings-item__text">
            <span class="settings-item__label">LSPログ</span>
            <span class="settings-item__description">开启后可进入独立页面查看 LSP 日志。</span>
          </div>
          <input type="checkbox" id="setting-lsp-log" />
        </label>

        <div id="lsp-log-panel" class="settings-subpanel hidden">
          <button id="setting-view-lsp-log" type="button" class="secondary settings-subpanel__button">LSPログを見る</button>
        </div>

        <label class="settings-item" for="setting-show-popup">
          <div class="settings-item__text">
            <span class="settings-item__label">Hi UtaBuild通知</span>
            <span class="settings-item__description">歌曲切换时显示确认无需操作的提示信息。</span>
          </div>
          <input type="checkbox" id="setting-show-popup" checked />
        </label>

        <label class="settings-item" for="setting-auto-launch">
          <div class="settings-item__text">
            <span class="settings-item__label">UtaBuildに自動遷移</span>
            <span class="settings-item__description">当 UtaBuild 中没有匹配的歌词时自动跳转到 UtaBuild。</span>
          </div>
          <input type="checkbox" id="setting-auto-launch" checked />
        </label>
      </div>
    </section>

    <!-- LSP日志页面 -->
    <section id="lsp-log-view" class="lsp-log-view hidden">
      <div class="subpage-header">
        <button id="lsp-log-back-btn" type="button" class="secondary">設定に戻る</button>
        <div>
          <h2>LSPログ</h2>
          <p>不换行显示，可横向/纵向滑动，并支持缩放字体。</p>
        </div>
      </div>
      <div class="lsp-log-toolbar">
        <button id="lsp-log-refresh-btn" type="button" class="secondary">更新</button>
        <div class="lsp-log-zoom-controls" aria-label="ログ表示の拡大縮小">
          <button id="lsp-log-zoom-out" type="button" class="secondary" aria-label="ログを縮小">−</button>
          <span id="lsp-log-zoom-label">100%</span>
          <button id="lsp-log-zoom-in" type="button" class="secondary" aria-label="ログを拡大">＋</button>
        </div>
      </div>
      <div class="lsp-log-frame">
        <pre id="lsp-log-content" class="lsp-log-content">ページを開くとログを読み込みます...</pre>
      </div>
    </section>

    <!-- 搜索结果列表 -->
    <section id="result-list" class="hidden">
      <h2>検索結果</h2>
      <div id="source-tabs" class="source-tabs" role="tablist" aria-label="検索ソース">
        <button type="button" class="source-tab active" data-source="all" role="tab" aria-selected="true">全部</button>
        <button type="button" class="source-tab" data-source="utaten" role="tab" aria-selected="false">UtaTen</button>
        <button type="button" class="source-tab" data-source="qq_music" role="tab" aria-selected="false">QQ音楽</button>
      </div>
      <p id="results-summary" class="results-summary hidden"></p>
      <div id="results-container"></div>
      <div id="results-pagination" class="pagination hidden">
        <span id="pagination-info"></span>
      </div>
      <button id="back-btn" class="secondary">戻る</button>
    </section>

    <!-- 歌词显示 -->
    <section id="lyrics-view" class="hidden">
      <div id="lyrics-header">
        <h2 id="lyrics-title"></h2>
        <p id="lyrics-artist"></p>
      </div>
      
      <div class="lyrics-controls">
        <div class="control-group">
          <span>文字サイズ:</span>
          <button type="button" data-size="small" aria-pressed="false">小</button>
          <button type="button" data-size="medium" aria-pressed="true">中</button>
          <button type="button" data-size="large" aria-pressed="false">大</button>
        </div>
        <div class="control-group">
          <span>ダークモード:</span>
          <button type="button" data-dark="on" aria-pressed="false">ON</button>
          <button type="button" data-dark="off" aria-pressed="true">OFF</button>
        </div>
      </div>
      
      <div id="lyrics-body"></div>
      
      <button id="back-to-results-btn" class="secondary">結果に戻る</button>
    </section>

    <!-- 加载指示器 -->
    <div id="loading" class="hidden">
      <div class="spinner"></div>
      <p>読み込み中...</p>
    </div>

    <!-- 错误提示 -->
    <div id="error-toast" class="hidden">
      <span id="error-message"></span>
      <button id="error-close">&times;</button>
    </div>

    <div id="confirm-dialog" class="confirm-dialog hidden" role="presentation">
      <div class="confirm-dialog__panel" role="dialog" aria-modal="true" aria-labelledby="confirm-dialog-title" aria-describedby="confirm-dialog-message">
        <p id="confirm-dialog-step" class="confirm-dialog__step"></p>
        <h2 id="confirm-dialog-title" class="confirm-dialog__title">キャッシュを削除</h2>
        <p id="confirm-dialog-message" class="confirm-dialog__message"></p>
        <div class="confirm-dialog__actions">
          <button id="confirm-dialog-cancel" type="button" class="secondary">キャンセル</button>
          <button id="confirm-dialog-confirm" type="button" class="confirm-dialog__confirm" disabled>確認</button>
        </div>
      </div>
    </div>

    <!-- 底部菜单 -->
    <nav id="bottom-menu" class="bottom-menu" data-active-tab="search" aria-label="メインメニュー">
      <div class="bottom-menu__track" role="tablist" aria-label="メインメニュー">
        <div class="bottom-menu__slider" aria-hidden="true"></div>
        <button type="button" role="tab" class="bottom-menu__item active" data-app-tab="search" aria-selected="true" aria-current="page">検索</button>
        <button type="button" role="tab" class="bottom-menu__item" data-app-tab="songs" aria-selected="false">保存曲</button>
        <button type="button" role="tab" class="bottom-menu__item" data-app-tab="settings" aria-selected="false">設定</button>
      </div>
    </nav>
  </div>

  <script src="js/app.js" type="module"></script>
</body>
</html>
