<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TITLE - ARTIST</title>
<style>
/* === Synced with src/scss/ design system === */
/* Three themes: dark (default), light, mygo */

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --primary: #4493f8;
  --primary-hover: #58a6ff;
  --bg: #0d1117;
  --bg-secondary: #161b22;
  --surface: #1c2128;
  --surface-hover: #242a33;
  --text: #e6edf3;
  --text-secondary: #8b949e;
  --ruby-color: #7d8590;
  --border: rgba(240, 246, 252, 0.08);
  --border-focus: rgba(68, 147, 248, 0.35);
  --shadow-sm: 0 4px 12px rgba(0, 0, 0, 0.20);
  --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.24);
  --motion-fast: 0.15s;
  --motion-slow: 0.35s;
}

body[data-theme="light"] {
  --primary: #0969da;
  --primary-hover: #0860ca;
  --bg: #ffffff;
  --bg-secondary: #f6f8fa;
  --surface: #f0f2f5;
  --surface-hover: #e8eaed;
  --text: #1f2328;
  --text-secondary: #656d76;
  --ruby-color: #656d76;
  --border: rgba(31, 35, 40, 0.08);
  --shadow-sm: 0 2px 8px rgba(51, 68, 102, 0.08);
  --shadow-md: 0 6px 18px rgba(51, 68, 102, 0.10);
}

body[data-theme="mygo"] {
  --primary: #77BBDD;
  --primary-hover: #99CCEE;
  --bg: #080d1a;
  --bg-secondary: #0e1627;
  --surface: rgba(18, 28, 48, 0.82);
  --surface-hover: rgba(28, 40, 62, 0.88);
  --text: #e8edf5;
  --text-secondary: #8a9bc0;
  --ruby-color: #7d8fb8;
  --border: rgba(119, 187, 221, 0.13);
  --border-focus: rgba(119, 187, 221, 0.35);
  --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
  --shadow-md: 0 6px 20px rgba(0, 0, 0, 0.4);
}

body {
  font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans CJK JP", "Meiryo", sans-serif;
  font-feature-settings: "palt";
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  min-height: 100vh;
  transition: background var(--motion-slow) ease, color var(--motion-slow) ease;
}

body[data-theme="mygo"] {
  background-image:
    radial-gradient(ellipse 80% 60% at 50% -10%, rgba(119, 187, 221, 0.06), transparent 70%),
    radial-gradient(ellipse 40% 30% at 75% 30%, rgba(255, 136, 153, 0.03), transparent),
    radial-gradient(ellipse 35% 25% at 20% 60%, rgba(153, 136, 204, 0.04), transparent);
}

.container {
  max-width: 720px;
  margin: 0 auto;
  padding: 32px 20px 48px;
}

/* === Header === */
.header {
  display: flex;
  align-items: center;
  gap: 20px;
  margin-bottom: 24px;
}

.cover-art {
  width: 120px;
  height: 120px;
  border-radius: 16px;
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  flex-shrink: 0;
  background-size: cover;
  background-position: center;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-secondary);
  font-size: 40px;
  overflow: hidden;
  transition: border-color var(--motion-slow), box-shadow var(--motion-slow);
}

.cover-art.has-cover {
  border-color: var(--border-focus);
  box-shadow: 0 8px 20px rgba(0, 0, 0, 0.18);
}

body[data-theme="mygo"] .cover-art.has-cover {
  box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25), 0 0 40px rgba(119, 187, 221, 0.12);
}

.header-info { min-width: 0; }

.header-info h1 {
  font-size: 1.5rem;
  font-weight: 700;
  margin-bottom: 4px;
  line-height: 1.3;
  letter-spacing: 0.02em;
}

.header-info h1 a {
  color: var(--text);
  text-decoration: none;
  transition: color var(--motion-fast), text-shadow var(--motion-fast);
}

.header-info h1 a:hover,
.header-info h1 a:focus-visible {
  color: var(--primary);
  text-shadow: 0 0 14px rgba(68, 147, 248, 0.3);
  outline: none;
}

.header-info .artist {
  font-size: 0.95rem;
  color: var(--text-secondary);
}

/* === Controls === */
.controls {
  display: flex;
  flex-wrap: wrap;
  gap: 16px;
  justify-content: center;
  padding: 10px 14px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  box-shadow: var(--shadow-sm);
  margin-bottom: 20px;
  transition: background var(--motion-slow), border-color var(--motion-slow);
  backdrop-filter: blur(12px);
}

body[data-theme="mygo"] .controls {
  backdrop-filter: blur(20px) saturate(130%);
}

.control-group {
  display: flex;
  align-items: center;
  gap: 6px;
}

.control-group span {
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--text-secondary);
  letter-spacing: 0.03em;
}

.control-group button {
  padding: 4px 12px;
  font-size: 0.78rem;
  font-weight: 600;
  border: 1px solid var(--border);
  border-radius: 999px;
  background: transparent;
  color: var(--text-secondary);
  cursor: pointer;
  transition: all var(--motion-fast) ease;
  letter-spacing: 0.02em;
}

.control-group button:hover {
  border-color: var(--primary);
  color: var(--primary);
}

.control-group button:focus-visible {
  outline: 2px solid var(--border-focus);
  outline-offset: 2px;
}

.control-group button.active {
  background: var(--primary);
  color: #fff;
  border-color: var(--primary);
  box-shadow: 0 0 12px rgba(68, 147, 248, 0.25);
}

body[data-theme="mygo"] .control-group button.active {
  box-shadow: 0 0 16px rgba(119, 187, 221, 0.35);
}

/* === Ruby Rendering === */
.lyricBody {
  user-select: none;
  letter-spacing: 1px;
  line-height: 2.3;
  padding: 28px 24px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px;
  box-shadow: var(--shadow-md);
  min-height: 200px;
  transition: background var(--motion-slow), border-color var(--motion-slow), box-shadow var(--motion-slow);
  backdrop-filter: blur(8px);
}

body[data-theme="mygo"] .lyricBody {
  backdrop-filter: blur(16px) saturate(110%);
}

.lyricBody span.ruby {
  margin-bottom: 0.55em;
  display: inline-table;
  position: relative;
  vertical-align: bottom;
}

.lyricBody span.ruby span.rb {
  display: table-row;
  position: relative;
  line-height: 1.2;
}

.lyricBody span.ruby span.rt {
  display: table-header-group;
  line-height: 1.8;
  color: var(--ruby-color);
  white-space: nowrap;
  text-align: center;
  letter-spacing: -0.001em;
  transition: color var(--motion-slow);
}

.lyricBody div.medium { font-size: 17px; }
.lyricBody div.medium span.ruby span.rt { font-size: 11px; }
.lyricBody div.small { font-size: 13px; }
.lyricBody div.small span.ruby span.rt { font-size: 7px; }
.lyricBody div.large { font-size: 21px; }
.lyricBody div.large span.ruby { line-height: 2.6; }
.lyricBody div.large span.ruby span.rt { font-size: 14px; }

/* === Footer === */
.footer {
  text-align: center;
  margin-top: 32px;
  color: var(--text-secondary);
  font-size: 0.78rem;
  opacity: 0.55;
  letter-spacing: 0.04em;
}
</style>
</head>
<body data-theme="dark">
<div class="container">

<div class="header">
  <div class="cover-art COVER_CLASS" STYLE_COVER></div>
  <div class="header-info">
    <h1><a href="LYRICS_URL" target="_blank" rel="noopener">TITLE</a></h1>
    <p class="artist">ARTIST</p>
  </div>
</div>

<div class="controls">
  <div class="control-group">
    <span>文字サイズ</span>
    <button data-size="small">小</button>
    <button data-size="medium" class="active">中</button>
    <button data-size="large">大</button>
  </div>
  <div class="control-group">
    <span>テーマ</span>
    <button data-theme="dark" class="active">暗</button>
    <button data-theme="light">亮</button>
    <button data-theme="mygo">MyGO</button>
  </div>
</div>

<div class="lyricBody">
  <div class="medium">
RUBY_HTML
  </div>
</div>

<div class="footer">Powered by UtaBuild</div>

</div>
<script>
(function() {
  var body = document.body;
  var lyricDiv = document.querySelector('.lyricBody > div');

  function setActive(selector, value, attr) {
    document.querySelectorAll(selector).forEach(function(btn) {
      btn.classList.toggle('active', btn.dataset[attr] === value);
    });
  }

  function applyTheme(theme) {
    body.setAttribute('data-theme', theme);
    setActive('[data-theme]', theme, 'theme');
    try { localStorage.setItem('utabuild-theme', theme); } catch(e) {}
  }

  document.querySelectorAll('[data-size]').forEach(function(btn) {
    btn.addEventListener('click', function() {
      var size = btn.dataset.size;
      lyricDiv.className = size;
      setActive('[data-size]', size, 'size');
      try { localStorage.setItem('utabuild-fontsize', size); } catch(e) {}
    });
  });

  document.querySelectorAll('[data-theme]').forEach(function(btn) {
    btn.addEventListener('click', function() {
      applyTheme(btn.dataset.theme);
    });
  });

  try {
    var savedSize = localStorage.getItem('utabuild-fontsize');
    if (savedSize) {
      lyricDiv.className = savedSize;
      setActive('[data-size]', savedSize, 'size');
    }
    var savedTheme = localStorage.getItem('utabuild-theme');
    if (savedTheme) {
      applyTheme(savedTheme);
    }
  } catch(e) {}
})();
</script>
</body>
</html>
